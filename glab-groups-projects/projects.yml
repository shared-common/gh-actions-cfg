# Supported project keys per item:
# - name
# - source_project_url
# - target_group_path
# - allow_blob_rewrite: null
# - force_lfs: null
# - git_timeout_seconds: null
# - gitlab_source_include_subgroups: null
# - mirror_pristine_tar: null
# - read_retry_attempts: null
# - read_retry_backoff_seconds: null
# - retry_attempts: null
# - retry_backoff_seconds: null
# - size_limit_bytes: null
# - max_blob_bytes: null
# - additional_branches: []
# - additional_tags: []
# Use null or [] to inherit defaults / apply no per-project override.
# Each entry is a single explicit source project. The target project path is
# always built as <target_group_path>/<name>.
#
# Keep per-project branch or tag control inline so adding a new mirror is a
# one-entry edit:
# - mirror_pristine_tar: when true, mirror and protect pristine-tar for that
#   explicit project only
# - additional_branches: extra source branches to mirror when present; these
#   branches are also protected on the target after push
# - additional_tags: extra source tags to mirror when present
# - target_branches_protect: extra target branch names to protect after push
#
# The source default branch always syncs to the managed target branch named by
# the BWS secret GIT_BRANCH_GLAB_FORKS. The shared runtime no longer creates
# extra target-only mcr/* branches or resets project default-branch protection
# during mirror runs.
kind: glab-groups/projects
version: 1
projects:
  - name: darkman
    source_project_url: https://gitlab.com/WhyNotHugo/darkman
    target_group_path: glab-forks/labwc
  - name: user-recovery-tools
    source_project_url: https://chromium.googlesource.com/chromiumos/user-recovery-tools
    target_group_path: glab-forks/chromium
  - name: gptfdisk
    source_project_url: https://git.code.sf.net/p/gptfdisk/code
    target_group_path: glab-forks/sourceforge
  - name: refind
    source_project_url: https://git.code.sf.net/p/refind/code
    target_group_path: glab-forks/sourceforge
  - name: zsh
    source_project_url: https://git.code.sf.net/p/zsh/code
    target_group_path: glab-forks/sourceforge
  - name: xtables-addons
    source_project_url: https://codeberg.org/jengelh/xtables-addons
    target_group_path: glab-forks/netfilter
  - name: seatd
    source_project_url: https://git.sr.ht/~kennylevinsen/seatd
    target_group_path: glab-forks/labwc
  - name: greetd
    source_project_url: https://git.sr.ht/~kennylevinsen/greetd
    target_group_path: glab-forks/labwc
  - name: wlsunset
    source_project_url: https://git.sr.ht/~kennylevinsen/wlsunset
    target_group_path: glab-forks/labwc
  - name: wldash
    source_project_url: https://git.sr.ht/~kennylevinsen/wldash
    target_group_path: glab-forks/labwc
  - name: poweralertd
    source_project_url: https://git.sr.ht/~kennylevinsen/poweralertd
    target_group_path: glab-forks/labwc
  - name: tutanota
    source_project_url: https://github.com/tutao/tutanota
    target_group_path: glab-forks/other
  - name: codex-desktop-app
    source_project_url: https://github.com/ilysenko/codex-desktop-linux
    target_group_path: glab-forks/other
